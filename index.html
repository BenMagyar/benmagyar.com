    <style>
      :root {
        color-scheme: light;
        --page-bg: #ffffff;
        --page-fg: #000000;
        --page-pad-x: clamp(1.5rem, 5vw, 5rem);
        --visualizer-indent: var(--page-pad-x);
        --visualizer-overflow: 420px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow-x: hidden;
        background: var(--page-bg);
        color: var(--page-fg);
        font-family: "Xanh Mono", monospace;
      }

      body {
        min-height: 100vh;
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding-block: clamp(1.5rem, 4vw, 3rem);
        padding-inline: var(--page-pad-x);
      }

      .landing {
        width: 100%;
        position: relative;
      }

      .intro {
        position: relative;
        z-index: 1;
        width: fit-content;
        max-width: 100%;
      }

      .name,
      .role {
        margin: 0;
      }

      .name {
        font-size: clamp(2.6rem, 6vw, 4.75rem);
        line-height: 0.94;
        white-space: nowrap;
      }

      .role {
        margin-top: 0.45rem;
        font-size: clamp(1.05rem, 2.4vw, 1.6rem);
        line-height: 1.15;
        font-style: italic;
      }

      .role a {
        color: #e91b23;
        text-decoration: none;
      }

      .role a:hover {
        text-decoration: underline;
      }

      .visualizer-shell {
        position: absolute;
        left: var(--visualizer-indent);
        right: calc(var(--visualizer-overflow) * -1);
        overflow: visible;
        pointer-events: none;
      }

      .fixed-links {
        position: absolute;
        inset: 0;
        pointer-events: none;
        visibility: hidden;
      }

      .fixed-links.is-ready {
        visibility: visible;
      }

      .fixed-link {
        position: absolute;
        color: #0b57d0;
        text-decoration: none;
        white-space: nowrap;
        pointer-events: auto;
      }

      .fixed-link:hover {
        text-decoration: underline;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      @media (max-width: 900px) {
        main {
          --page-pad-x: clamp(1.25rem, 6vw, 2.25rem);
        }

        .intro {
          max-width: min(20rem, 100%);
        }

        .name {
          font-size: clamp(2.1rem, 9vw, 3.2rem);
        }

        .role {
          font-size: clamp(0.95rem, 3.8vw, 1.15rem);
        }

        .visualizer-shell {
          right: calc(min(28vw, 140px) * -1);
        }
      }
    </style>
  </head>
